name: Sync & Build Release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-release.yml']
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      fork_suffix:
        description: 'Fork build suffix number (default: highest existing suffix for the official version + 1)'
        type: string
        required: false
      dry_run:
        description: 'Only check upstream — skip merge, build and release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

# ─── Environment-wide mirror for Electron downloads ──────────
env:
  ELECTRON_MIRROR: ${{ secrets.ELECTRON_MIRROR || 'https://npmmirror.com/mirrors/electron/' }}

jobs:
  # ═══════════════════════════════════════════════════════════
  # 1) Sync: merge upstream only when it actually moved, then
  #    decide whether upstream has commits not yet released
  #    (specs/fork-release-workflow.md is the source of truth).
  # ═══════════════════════════════════════════════════════════
  sync:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      build_sha: ${{ steps.decide.outputs.build_sha }}
      version: ${{ steps.patch.outputs.version }}
      release_tag: ${{ steps.patch.outputs.release_tag }}
      build_date: ${{ steps.patch.outputs.build_date }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 1a. Merge upstream only if it has new commits ────
      - name: Fetch upstream & detect new commits
        id: upstream
        run: |
          # Manual dispatch: never sync, build straight from current HEAD.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch — skipping upstream check"
            echo "should_sync=false" >> "$GITHUB_OUTPUT"
            echo "upstream_ok=true" >> "$GITHUB_OUTPUT"
            echo "upstream_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git remote add upstream https://github.com/zai-org/zcode.git 2>/dev/null \
            || git remote set-url upstream https://github.com/zai-org/zcode.git

          # upstream_ok 供 decide 使用：fetch 失败时无法证明“官方有新提交”，
          # 本轮必须跳过构建，而不是误判成“有更新”。
          if ! git fetch upstream main --no-tags; then
            echo "::warning::Failed to reach upstream — skipping sync for this run"
            echo "should_sync=false" >> "$GITHUB_OUTPUT"
            echo "upstream_ok=false" >> "$GITHUB_OUTPUT"
            echo "upstream_sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          UPSTREAM=$(git rev-parse upstream/main)
          echo "upstream_sha=${UPSTREAM}" >> "$GITHUB_OUTPUT"
          echo "upstream_ok=true" >> "$GITHUB_OUTPUT"

          # 关键修复：fork 自带提交（workflow、自动更新源等），HEAD 永远不会
          # 等于 upstream/main，直接比较 SHA 会把“上游无更新”误判成“有更新”，
          # 导致每次定时都产出新的 fork 版本。
          # 改用祖先判断：upstream/main 已经是 HEAD 的祖先 → 上游已合并 → 无需同步。
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Upstream ${UPSTREAM:0:12} is already an ancestor of HEAD — nothing to sync"
            echo "should_sync=false" >> "$GITHUB_OUTPUT"
          else
            echo "Upstream ${UPSTREAM:0:12} has new commits — will merge"
            echo "should_sync=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream into fork
        if: steps.upstream.outputs.should_sync == 'true'
        run: |
          git config user.name "ZCode Fork Sync Bot"
          git config user.email "bot@users.noreply.github.com"

          if git merge --no-ff upstream/main \
               -m "chore: sync upstream $(date -u +%Y-%m-%d) [skip ci]" \
               -m "Upstream: ${{ steps.upstream.outputs.upstream_sha }}"; then
            git push origin main
            echo "Merged upstream ${{ steps.upstream.outputs.upstream_sha }}"
          else
            git merge --abort || true
            echo "::error::Upstream merge conflict. Resolve it manually, then re-run."
            echo "## ⚠️ Sync conflict" >> $GITHUB_STEP_SUMMARY
            echo "Upstream \`${{ steps.upstream.outputs.upstream_sha }}\` conflicts with fork changes." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      # ── 1b. Build only when upstream has unreleased commits ──
      - name: Decide whether to build
        id: decide
        run: |
          # 无论后续是否构建，都先把“实际要发布/已发布的提交”告诉下游：
          # 合并上游后 HEAD 是一个新提交，而 actions/checkout 默认按 github.sha
          # （触发时的旧提交）检出。不显式传递就会出现“构建旧代码、tag 打旧提交”的
          # 问题，下一轮立刻又判定为未发布，形成重复构建。
          BUILD_SHA=$(git rev-parse HEAD)
          echo "build_sha=${BUILD_SHA}" >> "$GITHUB_OUTPUT"

          # Manual dispatch always builds.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — forcing build" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # 上游不可达 → 无法证明“官方有新提交” → 本轮不构建（fetch 步骤已告警）。
          if [ "${{ steps.upstream.outputs.upstream_ok }}" != "true" ]; then
            echo "Upstream unreachable — cannot verify official commits, skip build" >> $GITHUB_STEP_SUMMARY
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          UPSTREAM_SHA="${{ steps.upstream.outputs.upstream_sha }}"
          HEAD_TAGS=$(git tag --points-at HEAD)

          # 构建判据：官方仓库是否有「尚未发布」的提交。
          # upstream/main 已被任一 fork 发布 tag（v*-fork.*）包含 → 这批官方提交
          # 已经发布过 → 不构建（上游无新提交时的常态，fork 自身提交也不触发发版）；
          # 未被包含 → 上游有新提交，或上次发布被取消/失败 → 构建（下轮自动补发）。
          # 旧判据“HEAD 上是否已有 tag”会把 fork 自己的每次提交都当成待发布内容。
          RELEASED=false
          for t in $(git tag -l 'v*-fork.*'); do
            if git merge-base --is-ancestor "$UPSTREAM_SHA" "refs/tags/$t"; then
              RELEASED=true
              break
            fi
          done

          {
            echo "## Build decision"
            echo ""
            echo "- HEAD: \`${BUILD_SHA}\`"
            echo "- Upstream: \`${UPSTREAM_SHA}\`"
            echo "- Upstream already released by a fork tag: \`${RELEASED}\`"
            echo "- Tags at HEAD: \`${HEAD_TAGS:-<none>}\`"
            echo "- Upstream synced this run: \`${{ steps.upstream.outputs.should_sync }}\`"
          } >> $GITHUB_STEP_SUMMARY

          if [ "$RELEASED" = "true" ]; then
            echo "Upstream has no new unreleased commits — nothing to build"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Upstream has unreleased commits — will build"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

      # ── 1c. Fork version tag ─────────────────────────────
      - name: Compute fork version
        id: patch
        env:
          # 输入经 env 注入，避免把可执行内容直接插进 run 脚本。
          INPUT_FORK_SUFFIX: ${{ github.event.inputs.fork_suffix }}
        run: |
          # 官方版本号：上游发版只更新 README 的「更新」区块，从不改根
          # package.json（open source 至今一直是 3.14.0），直接用 package.json
          # 会让镜像版本永远停在 3.14.0-fork.N。这里按 README 解析，解析不到
          # 再回退 package.json 并告警。
          extract_official_version() {
            awk '/^## (更新|Updates)[[:space:]]*$/{f=1;next} /^## /{f=0} f' "$1" 2>/dev/null \
              | grep -oE 'ZCode v[0-9]+\.[0-9]+\.[0-9]+' \
              | head -n 1 \
              | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true
          }

          BASE_VERSION=$(extract_official_version README.md)
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION=$(extract_official_version README.en.md)
          fi
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION=$(node -e "console.log(require('./package.json').version)")
            echo "::warning::Official version not found in README changelog — falling back to package.json (${BASE_VERSION})"
          fi
          case "$BASE_VERSION" in
            ''|*[!0-9.]*)
              echo "::error::Invalid official version: ${BASE_VERSION}"
              exit 1
              ;;
          esac

          # fork 序号 = 同一官方版本下已发布 tag 的最大序号 + 1，无则从 1 开始。
          # 官方版本号一变，前缀跟着变、序号自动重置回 1。不再使用
          # github.run_number：它跨版本单调递增（3.14.3 的首个构建会拿到跳号的
          # fork.19），且被跳过的运行同样会消耗编号。
          PREFIX="v${BASE_VERSION}-fork."
          MAX=0
          for t in $(git tag -l "${PREFIX}*"); do
            n="${t#"${PREFIX}"}"
            case "$n" in
              ''|*[!0-9]*) continue ;;
            esac
            if [ "$n" -gt "$MAX" ]; then
              MAX=$n
            fi
          done

          SUFFIX="${INPUT_FORK_SUFFIX:-$((MAX + 1))}"
          # 序号必须是纯数字，否则会生成坏掉的 tag / semver，直接失败。
          case "$SUFFIX" in
            ''|*[!0-9]*)
              echo "::error::Invalid fork suffix: ${SUFFIX}"
              exit 1
              ;;
          esac

          FORK_VERSION="${BASE_VERSION}-fork.${SUFFIX}"
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "version=${FORK_VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=v${FORK_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"
          {
            echo "## Fork version"
            echo ""
            echo "- Official version: \`${BASE_VERSION}\` (from README changelog)"
            echo "- Highest released suffix for this version: \`${MAX}\`"
            echo "- Chosen suffix: \`${SUFFIX}\`"
          } >> $GITHUB_STEP_SUMMARY

      - name: Dry-run mode
        if: github.event.inputs.dry_run == 'true'
        run: |
          echo "# Dry-run mode" >> $GITHUB_STEP_SUMMARY
          echo "Sync checked; build and release skipped." >> $GITHUB_STEP_SUMMARY

      - name: Skipped (no changes)
        if: steps.decide.outputs.should_build == 'false'
        run: |
          echo "## ✅ Skipped" >> $GITHUB_STEP_SUMMARY
          echo "No new unreleased upstream commits — no build produced." >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════════════════════════
  # 2) Build matrix (4 platforms in parallel)
  # ═══════════════════════════════════════════════════════════
  build:
    needs: [sync]
    if: needs.sync.outputs.should_build == 'true' && github.event.inputs.dry_run != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target_os: mac
            target_arch: arm64
            pretty: macOS arm64

          - runner: macos-15
            target_os: mac
            target_arch: x64
            pretty: macOS x64

          - runner: windows-latest
            target_os: win
            target_arch: x64
            pretty: Windows x64

          - runner: ubuntu-24.04
            target_os: linux
            target_arch: x64
            pretty: Linux x64

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120

    env:
      ZCODE_ENV: production
      ZCODE_TARGET_OS: ${{ matrix.target_os }}
      ZCODE_TARGET_ARCH: ${{ matrix.target_arch }}
      ZCODE_SKIP_REMOTE_ASSETS: '1'
      ZCODE_ENABLE_MAC_SIGN: ${{ matrix.target_os == 'mac' && secrets.APPLE_SIGNING_IDENTITY != '' && '1' || '0' }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '' }}

    steps:
      # 必须检出 sync 决定发布的那个提交（合并上游之后的新 HEAD），
      # 而不是 github.sha（本次运行触发时的旧提交）。
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.build_sha }}

      # ── macOS: import signing certificate ────────────────
      - name: Import macOS signing certificate
        if: runner.os == 'macOS' && env.ZCODE_ENABLE_MAC_SIGN == '1'
        env:
          CERT_BASE64: ${{ secrets.MACOS_CERTIFICATE }}
          CERT_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/zcode-signing.keychain-db
          echo "$CERT_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security create-keychain -p temp "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p temp "$KEYCHAIN_PATH"
          security import $RUNNER_TEMP/cert.p12 \
            -P "$CERT_PWD" \
            -k "$KEYCHAIN_PATH" \
            -T /usr/bin/codesign \
            -T /usr/bin/productsign
          rm $RUNNER_TEMP/cert.p12
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | awk '{print $NF}')
          security show-keychain-info "$KEYCHAIN_PATH"

      # ── Linux: extra packaging deps ──────────────────────
      - name: Install Linux packaging deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm xz-utils libfuse2 libarchive-tools 2>&1

      # ── Toolchain ────────────────────────────────────────
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: 'pnpm'

      # ── Patch version in root package.json ───────────────
      - name: Patch package.json version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Get-Content package.json -Raw | ConvertFrom-Json
          $p.version = '${{ needs.sync.outputs.version }}'
          $p | ConvertTo-Json -Depth 10 | Set-Content package.json

      - name: Patch package.json version (Unix)
        if: runner.os != 'Windows'
        run: |
          node -e "
          const fs = require('fs');
          const o = JSON.parse(fs.readFileSync('package.json','utf8'));
          o.version = '${{ needs.sync.outputs.version }}';
          fs.writeFileSync('package.json',JSON.stringify(o,null,2)+'\n');
          "

      # ── Install → Build → Package (one command) ──────────
      - name: Install dependencies
        run: pnpm install

      - name: Build & package
        run: pnpm bundle:desktop -- --os ${{ matrix.target_os }} --arch ${{ matrix.target_arch }}

      # ── Upload artifacts ─────────────────────────────────
      - name: Upload DMG (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.pretty }}
          path: |
            packages/desktop/dist/ZCode*.dmg
            packages/desktop/dist/latest-mac.yml
          if-no-files-found: error

      - name: Upload ZIP (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.pretty }}-zip
          path: |
            packages/desktop/dist/ZCode*.zip
            packages/desktop/dist/latest-mac.yml
          if-no-files-found: warn

      - name: Upload NSIS installer (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.pretty }}
          path: |
            packages/desktop/dist/ZCode*.exe
            packages/desktop/dist/latest.yml
          if-no-files-found: error

      - name: Upload AppImage (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.pretty }}
          path: |
            packages/desktop/dist/ZCode*.AppImage
            packages/desktop/dist/latest-linux.yml
          if-no-files-found: error

      - name: Upload deb + rpm + pacman (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.pretty }}-extra
          path: |
            packages/desktop/dist/ZCode*.deb
            packages/desktop/dist/ZCode*.rpm
            packages/desktop/dist/ZCode*.pkg.tar.zst
            packages/desktop/dist/latest-linux.yml
          if-no-files-found: warn

  # ═══════════════════════════════════════════════════════════
  # 3) Create GitHub Release with all artifacts
  # ═══════════════════════════════════════════════════════════
  release:
    if: github.event.inputs.dry_run != 'true'
    needs: [sync, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.build_sha }}

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: _artifacts
          merge-multiple: true

      - name: Show downloaded files
        run: |
          echo "## Artifacts collected" >> $GITHUB_STEP_SUMMARY
          ls -lhR _artifacts/ >> $GITHUB_STEP_SUMMARY

      - name: Build release notes
        id: notes
        run: |
          cat > _release_body.md <<'EOF'
          # ZCode Fork Build

          **Version:** ${{ needs.sync.outputs.version }}
          **Build date:** ${{ needs.sync.outputs.build_date }}
          **Source:** [My-Search/ZCode](https://github.com/My-Search/ZCode) — synced from [zai-org/zcode](https://github.com/zai-org/zcode)

          ## Downloads

          EOF

          for f in _artifacts/*; do
            if [ -f "$f" ]; then
              NAME=$(basename "$f")
              SIZE=$(du -h "$f" | cut -f1)
              echo "- \`$NAME\` (${SIZE})" >> _release_body.md
            fi
          done

          echo "" >> _release_body.md
          echo "---" >> _release_body.md
          echo "*macOS builds: ${{ secrets.APPLE_SIGNING_IDENTITY != '' && 'signed' || 'unsigned (right-click → Open)' }}*" >> _release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.sync.outputs.release_tag }}
          target_commitish: ${{ needs.sync.outputs.build_sha }}
          name: ZCode v${{ needs.sync.outputs.version }}
          body_path: _release_body.md
          draft: false
          prerelease: false
          files: _artifacts/*
